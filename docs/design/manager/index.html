<style>
:root {
  --accent: #f37a2c; --accent-fg: #ffffff;
  --radius: 12px;
  font-family: "Cantarell", "Ubuntu", "Noto Sans", system-ui, sans-serif;
  font-size: 14px;
}
[data-theme="dark"] {
  --page: #111214; --window: #242424; --view: #1e1e1e; --header: #2e2e2e; --sidebar: #2a2a2a;
  --card: rgba(255,255,255,0.07); --card-hover: rgba(255,255,255,0.11); --border: rgba(255,255,255,0.10);
  --fg: #ffffff; --dim: rgba(255,255,255,0.55); --row-sel: rgba(255,255,255,0.10);
  --warning: #f8e45c; --error: #ff7b63; --success: #8ff0a4; --button: rgba(255,255,255,0.10);
  --shadow: 0 20px 60px rgba(0,0,0,0.6); --mono-bg: rgba(255,255,255,0.06);
}
[data-theme="light"] {
  --page: #d8dade; --window: #fafafa; --view: #ffffff; --header: #ebebeb; --sidebar: #f0f0f0;
  --card: #ffffff; --card-hover: #f4f4f4; --border: rgba(0,0,0,0.10);
  --fg: rgba(0,0,0,0.82); --dim: rgba(0,0,0,0.55); --row-sel: rgba(0,0,0,0.07);
  --warning: #9c6e03; --error: #c01c28; --success: #1b8553; --button: rgba(0,0,0,0.07);
  --shadow: 0 20px 60px rgba(0,0,0,0.25); --mono-bg: rgba(0,0,0,0.05);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 18px 16px 40px; }
.proto-bar { width: min(1240px, 100%); display: flex; gap: 10px; align-items: center; margin-bottom: 12px; color: #c9c9c9; font-size: 13px; flex-wrap: wrap; }
[data-theme="light"] .proto-bar { color: #333; }
.proto-bar b { color: var(--accent); }
.proto-bar button { margin-left: auto; }
.window { width: min(1240px, 100%); height: 780px; background: var(--window); border-radius: var(--radius); box-shadow: var(--shadow); display: grid; grid-template-columns: 230px 1fr; overflow: hidden; border: 1px solid var(--border); }
/* Sidebar */
.sidebar { background: var(--sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border); min-width: 0; }
.sidebar .head { height: 50px; display: flex; align-items: center; justify-content: center; font-weight: 700; gap: 8px; }
.lockpill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--card); color: var(--dim); }
.lockpill.unlocked { background: color-mix(in srgb, var(--success) 22%, transparent); color: var(--success); }
.nav { padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; cursor: pointer; color: var(--fg); }
.nav button:hover { background: var(--card-hover); }
.nav button.active { background: var(--row-sel); font-weight: 700; }
.nav .count { margin-left: auto; font-size: 12px; color: var(--dim); }
.sidebar .foot { margin-top: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.sidebar .foot small { color: var(--dim); text-align: center; }
svg.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* Main */
.main { display: flex; flex-direction: column; min-width: 0; background: var(--view); }
.header { height: 50px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--header); border-bottom: 1px solid var(--border); }
.header .title { font-weight: 700; flex: 1; text-align: center; }
.header .title small { display: block; font-weight: 400; color: var(--dim); font-size: 11px; }
.content { flex: 1; overflow: auto; min-height: 0; }
button.btn { font: inherit; border: none; background: var(--button); color: var(--fg); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
button.btn:hover { filter: brightness(1.15); }
button.btn.flat { background: transparent; }
button.btn.flat:hover { background: var(--card-hover); }
button.btn.accent { background: var(--accent); color: var(--accent-fg); }
button.btn.danger { color: var(--error); }
button.btn.small { padding: 4px 10px; font-size: 12px; }
button.btn.icon-only { padding: 7px; }
/* Entries: list + detail */
.split { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
.list { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.list .tools { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 8px; padding: 7px 10px; }
.search input { all: unset; flex: 1; color: var(--fg); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--card); cursor: pointer; color: var(--fg); border: none; font-family: inherit; }
.chip.on { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.rows { overflow: auto; flex: 1; padding: 6px; }
.row { display: flex; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.row:hover { background: var(--card-hover); }
.row.sel { background: var(--row-sel); }
.avatar { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; flex: none; }
.row .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .mid { min-width: 0; flex: 1; }
.group-label { font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; padding: 10px 10px 4px; }
.detail { overflow: auto; padding: 22px 28px 40px; }
.detail h2 { margin: 0; font-size: 22px; }
.detail .sub { color: var(--dim); margin: 4px 0 18px; }
.boxed { background: var(--card); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; }
.boxed .item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--border); min-height: 48px; }
.boxed .item:last-child { border-bottom: none; }
.boxed .item .k { width: 120px; color: var(--dim); flex: none; }
.boxed .item .v { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.boxed .item .v.mono, .mono { font-family: "DejaVu Sans Mono", "Ubuntu Mono", ui-monospace, monospace; font-size: 13px; }
.section-title { font-weight: 700; margin: 6px 0 8px; }
.section-note { color: var(--dim); font-size: 12px; margin: -2px 0 10px; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--card-hover); margin-right: 4px; }
.dots { letter-spacing: 3px; }
.code { background: var(--mono-bg); border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.code .mono { flex: 1; overflow-wrap: anywhere; }
a.link { color: var(--accent); text-decoration: none; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.badge.ok { color: var(--success); background: color-mix(in srgb, var(--success) 16%, transparent); }
.badge.no { color: var(--error); background: color-mix(in srgb, var(--error) 16%, transparent); }
.badge.warn { color: var(--warning); background: color-mix(in srgb, var(--warning) 16%, transparent); }
.badge.dim { color: var(--dim); background: var(--card-hover); }
.pad { padding: 22px 28px 40px; max-width: 920px; margin: 0 auto; }
.pad h2 { margin: 0 0 4px; font-size: 22px; }
.pad .lead { color: var(--dim); margin: 0 0 18px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--dim); font-weight: 700; font-size: 12px; padding: 8px 12px; }
td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: top; font-size: 13px; }
.switch { width: 42px; height: 24px; border-radius: 99px; background: var(--button); position: relative; cursor: pointer; flex: none; border: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.switch.on { background: var(--accent); }
.switch.on::after { left: 21px; }
select { font: inherit; background: var(--button); color: var(--fg); border: none; border-radius: 8px; padding: 6px 10px; }
select option { background: var(--window); }
.empty { color: var(--dim); text-align: center; padding: 40px 0; }
.logo { display: inline-block; flex: none; }
.hero { display: flex; gap: 18px; align-items: center; margin-bottom: 22px; }
.hero p { margin: 4px 0 0; color: var(--dim); }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; }
.step { background: var(--card); border-radius: var(--radius); padding: 14px 16px; }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; margin-bottom: 8px; }
.step b { display: block; margin-bottom: 4px; }
.step span { color: var(--dim); font-size: 13px; }
details { background: var(--card); border-radius: 10px; margin-bottom: 8px; padding: 0 16px; }
details summary { cursor: pointer; padding: 12px 0; font-weight: 700; list-style: none; }
details summary::before { content: "›"; display: inline-block; margin-right: 10px; transition: transform .15s; color: var(--dim); }
details[open] summary::before { transform: rotate(90deg); }
details p { margin: 0 0 12px; color: var(--dim); }
kbd { font-family: inherit; font-size: 12px; background: var(--button); border-radius: 5px; padding: 2px 7px; border-bottom: 2px solid var(--border); }
.about { text-align: center; padding: 26px 24px 8px; }
.about h3 { margin: 12px 0 2px; font-size: 22px; }
.about .ver { color: var(--dim); }
.about p { color: var(--dim); margin: 12px auto; max-width: 380px; }
@media (max-width: 860px) { .steps { grid-template-columns: 1fr; } }
/* Dialog (the agent's approval, as rusthorse-dialog shows it) */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.overlay.show { display: flex; }
.dialog { width: min(600px, 100%); background: var(--window); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }
.dialog .dh { text-align: center; padding: 10px; background: var(--header); }
.dialog .dh b { display: block; } .dialog .dh small { color: var(--dim); }
.dialog .db { padding: 16px 24px 8px; }
.dialog .db h3 { margin: 4px 0 6px; font-size: 20px; }
.dialog .db p { color: var(--dim); margin: 0 0 14px; }
.dialog .df { display: flex; gap: 10px; padding: 12px 24px 18px; }
.dialog .df .grow { flex: 1; }
.form .item input, .form .item textarea { all: unset; flex: 1; color: var(--fg); min-width: 0; }
.form .item textarea { min-height: 40px; }
.toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #3a3a3a; color: #fff; padding: 10px 18px; border-radius: 99px; box-shadow: var(--shadow); display: none; z-index: 20; font-weight: 700; }
.toast.show { display: block; }
.revealed { color: var(--warning); }
.callout { border-radius: var(--radius); padding: 12px 16px; background: color-mix(in srgb, var(--warning) 12%, transparent); color: var(--fg); margin-bottom: 18px; display: flex; gap: 10px; }
.callout svg { color: var(--warning); margin-top: 2px; }
@media (max-width: 860px) {
  .window { grid-template-columns: 1fr; height: auto; }
  .sidebar { display: none; }
  .split { grid-template-columns: 1fr; }
  .list { border-right: none; max-height: 340px; }
}
</style>
</head>
<body>
<div class="proto-bar">
  <span><b>Prototype</b> of Rusthorse Manager — fake data, nothing is saved. The final app uses GTK 4 + libadwaita.</span>
  <button class="btn small" id="theme">Theme: dark / light</button>
</div>

<div class="window">
  <aside class="sidebar">
    <div class="head"><span id="sidelogo"></span>Rusthorse <span class="lockpill unlocked" id="lockpill">Unlocked</span></div>

  <section class="main">
    <div class="header">
      <span id="hleft"></span>
      <div class="title" id="htitle"></div>
      <span id="hright"></span>
    </div>
    <div class="content" id="content"></div>
  </section>
</div>

<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast"></div>

<script>

    <div class="db form"><div class="boxed">
      <div class="item"><div class="k">File</div><input value="~/dev/site2rss/.env"></div>
      <div class="item"><div class="k">Name prefix</div><input placeholder="optional, e.g. SITE2RSS_"></div>
      <div class="item"><div class="k">Group</div><input value="Imported"></div></div></div>
    <div class="df"><button class="btn" id="cancel">Cancel</button><span class="grow"></span><button class="btn accent" id="go">Preview…</button></div>`);
  document.getElementById('cancel').onclick = closeDialog;
  document.getElementById('go').onclick = () => { closeDialog(); preview('Import from a .env file', ['OPENAI_API_KEY', 'DATABASE_URL', 'SESSION_SECRET'], entries.map(e => e.name),
    (fresh) => done(fresh, 'Imported')); };
}
function importKeyring() {
  openDialog(`<div class="dh"><b>Import from GNOME Keyring or KWallet</b><small>Rusthorse</small></div>
    <div class="db form"><p>Choose the items by their attributes. Reading names does not unlock anything; reading values may ask the keyring.</p>
    <div class="boxed">
      <div class="item"><div class="k">Attribute</div><input value="aplicacao = segredo"></div>
      <div class="item"><div class="k">Name from</div><input value="the attribute nome"></div>
      <div class="item"><div class="k">Group</div><input value="Keyring"></div></div></div>
    <div class="df"><button class="btn" id="cancel">Cancel</button><span class="grow"></span><button class="btn accent" id="go">Preview…</button></div>`);
  document.getElementById('cancel').onclick = closeDialog;
  document.getElementById('go').onclick = () => { closeDialog(); preview('Import from GNOME Keyring', KEYRING, entries.map(e => e.name),
    (fresh) => done(fresh, 'Keyring')); };
}
function done(names, grp) {
  names.forEach((n, i) => entries.push({ id: 'i' + Date.now() + i, name: n, group: grp, user: '', url: '', host: '', port: '', tags: ['migrated'], notes: false, modified: 'now', value: 'fake-imported', uses: 0 }));
  renderNav(); toast(`Imported ${names.length} entries into ${grp} — the originals are untouched`);
}

function renderHelp() {
  header('Help', 'how Rusthorse works and how to use it', '', `<button class="btn flat" id="about2">About</button>`);
  const snippet = `## Secrets
- Secrets are managed by Rusthorse. \`rusthorse list --json\` shows what exists
  (names, usernames, URLs, hosts, ports, tags — never values).
- To use a secret, run the command through Rusthorse:
  \`rusthorse run NAME -- command args\` or \`rusthorse run VAR=NAME -- …\`.
  The human approves each use in a dialog.
- Never ask the human for a secret value, never print or echo secrets,
  and never use \`rusthorse reveal\`.
- Exit status 125 with a \`rusthorse:\` message: it did not run. If it was
  denied, or nobody answered, stop and ask the human.`;
  const lines = [['Command', 'Is this what I expected the agent to do now? Does it send data anywhere (curl, ssh, git push)?'],
    ['Secrets', 'Does this command need these secrets?'], ['Program', 'Is it the real tool, or something in a project or temporary directory?'],
    ['Directory', 'Is the agent working where I think it is?'], ['Requested by (unverified)', 'Is it the AI\'s shell, or something unexpected? Process names prove nothing.'],
    ['Warnings', 'Variables like GIT_SSH_COMMAND can make the program run other code. Deny unless you know why they are set.']];
  const keys = [['Ctrl', 'F', 'Search entries'], ['Ctrl', 'N', 'New entry'], ['Ctrl', 'L', 'Lock the vault'], ['Ctrl', ',', 'Settings'], ['', 'F1', 'Help'], ['', 'Esc', 'Close a dialog']];
  content.innerHTML = `<div class="pad">
    <div class="hero">${logoImg(64)}<div><h2 style="margin:0">Rusthorse</h2>
      <p>Keeps your secrets in a KeePass vault on this computer and lets programs — AI agents above all — use them without ever seeing them. You decide every use.</p></div></div>
    <div class="section-title">How it works</div>
    <div class="steps">
      <div class="step"><div class="n">1</div><b>A program asks</b><span>An AI agent runs <span class="mono">rusthorse run OPENAI_API_KEY -- …</span>. It names the secret, never sees it.</span></div>
      <div class="step"><div class="n">2</div><b>You decide</b><span>A dialog shows the command, the secrets, the program and who asked. Deny is the default.</span></div>
      <div class="step"><div class="n">3</div><b>The agent runs it</b><span>The secret goes into the command's environment; any copy of it in the output shows as [REDACTED].</span></div>
    </div>
    <div class="section-title">Reading an approval dialog</div>
    <div class="boxed">${lines.map(([k, v]) => `<div class="item"><div class="k" style="width:170px">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>
    <div class="section-title">Use it with an AI agent</div>
    <div class="section-note">Paste this into the agent's instructions file (CLAUDE.md, AGENTS.md, …).</div>
    <div class="code" style="align-items:flex-start"><pre class="mono" style="margin:0; white-space:pre-wrap; flex:1">${esc(snippet)}</pre><button class="btn small" id="cpsnip">${icon('copy')}Copy</button></div>
    <div class="section-title" style="margin-top:22px">Keyboard shortcuts</div>
    <div class="boxed">${keys.map(([m, k, t]) => `<div class="item"><div class="v">${esc(t)}</div><span>${m ? `<kbd>${m}</kbd> + ` : ''}<kbd>${esc(k)}</kbd></span></div>`).join('')}</div>
    <div class="section-title">Good to know</div>
    <details><summary>Rusthorse is not a sandbox</summary><p>It keeps secrets out of an AI agent's sight — its context, output and logs. Approving a command trusts everything that command does: read <span class="mono">sh -c</span> lines and scripts the agent just edited before you allow them.</p></details>
    <details><summary>On X11, other programs can click "Allow"</summary><p>Any program of yours can synthesize input or read the screen on X11. A Wayland session closes most of that. See the threat model, L2.</p></details>
    <details><summary>There is no password recovery</summary><p>If you forget the master password, the vault cannot be opened. Keep backups (Import &amp; backup); each one opens with the master password it was made with.</p></details>
    <div class="section-title" style="margin-top:22px">Troubleshooting</div>
    <details><summary>No dialog appears</summary><p>Open Status: the agent must be running, and "Dialogs" must say rusthorse-dialog or zenity. A program that can be modified by others is refused — run the chmod command Status shows.</p></details>
    <details><summary>The AI says "rusthorse: command not found"</summary><p>Its shell may not have ~/.cargo/bin on its PATH. Link the program into ~/.local/bin, or give the AI the full path.</p></details>
    <details><summary>"nobody answered the dialog in time"</summary><p>The dialog closed by itself (Settings → Dialogs wait). Nothing ran; ask the AI to try again when you are at the desk.</p></details>
    <div style="display:flex; gap:10px; margin-top:22px; flex-wrap:wrap">
      <button class="btn" id="docs">${icon('ext')}Documentation</button>
      <button class="btn" id="sec">${icon('ext')}Report a security problem</button>
      <span style="flex:1"></span>
      <button class="btn" id="about">About Rusthorse</button>
    </div></div>`;
  document.getElementById('cpsnip').onclick = () => toast('Copied — paste it into CLAUDE.md or AGENTS.md');
  document.getElementById('docs').onclick = () => toast('Opens docs/getting-started.md in the browser');
  document.getElementById('sec').onclick = () => toast('Opens SECURITY.md: report privately, never in a public issue');
  document.getElementById('about').onclick = about;
  document.getElementById('about2').onclick = about;
}

  openDialog(`<div class="dh"><b>About</b><small>Rusthorse</small></div>
    <div class="about">${logoImg(96)}<h3>Rusthorse</h3><div class="ver">0.1.0</div>
      <p>A local secrets vault that lets AI agents use credentials without seeing them.</p>
      <div class="boxed" style="text-align:left">
        <div class="item"><div class="k">Vault format</div><div class="v">KeePass KDBX 4 — opens in KeePassXC</div></div>
        <div class="item"><div class="k">Built with</div><div class="v">Rust · GTK 4 · libadwaita</div></div>
        <div class="item"><div class="k">License</div><div class="v">GNU GPL, version 3 or later</div></div>
        <div class="item"><div class="k">Source</div><div class="v"><a class="link" href="#" onclick="return false">github.com/Alle4you/rusthorse</a></div></div>
      </div></div>
    <div class="df"><span class="grow"></span><button class="btn" id="close">Close</button></div>`);

function renderStatus() {
  header('Status', 'what rusthorse doctor checks');
  const checks = [
    ['ok', 'rusthorse 0.1.0 (protocol 3)'], ['ok', 'The agent is running (systemd user service)'],
    ['ok', 'The agent runs the same program file as this manager'], ['ok', 'Dialogs: rusthorse-dialog 0.1.0'],
    ['warn', 'X11 session: any program of yours can click "Allow" or read keystrokes (threat model L2)'],
    ['ok', 'Yama ptrace_scope = 1'], ['ok', 'The vault is private (600) and KDBX 4.1'], ['ok', 'The socket directory is private (700)'],
  ];
  content.innerHTML = `<div class="pad">
    <div class="boxed">${checks.map(([k, t]) => `<div class="item"><span class="badge ${k === 'ok' ? 'ok' : 'warn'}">${k === 'ok' ? 'ok' : 'warn'}</span><div class="v">${esc(t)}</div></div>`).join('')}</div>
    <div class="section-note">The X11 warning is not an error: it is the most important limitation to understand. A Wayland session closes most of it.</div></div>`;
}

function approve(title, explanation, rows, warning, onAllow) {
  openDialog(`<div class="dh"><b>Rusthorse</b><small>Approval required — shown by the agent, not by the manager</small></div>
    <div class="db"><h3>${esc(title)}</h3><p>${esc(explanation)}</p>
    ${warning ? `<div class="callout">${icon('warn')}<div>${esc(warning)}</div></div>` : ''}
    <div class="boxed">${rows.map(([k, v]) => `<div class="item"><div class="k">${esc(k)}</div><div class="v mono">${esc(v)}</div></div>`).join('')}
      <div class="item"><div class="k">Requested by<br><small>unverified</small></div><div class="v mono">rusthorse-manager[4242] ← cinnamon[1890]</div></div></div></div>
    <div class="df"><button class="btn" id="deny">Deny</button><span class="grow"></span><button class="btn" id="allow">Allow once</button></div>`);
  document.getElementById('deny').onclick = () => { closeDialog(); toast('Denied'); };
  document.getElementById('allow').onclick = () => { closeDialog(); onAllow(); };
  document.getElementById('deny').focus();
}
function openDialog(html) { document.getElementById('dialog').innerHTML = html; document.getElementById('overlay').classList.add('show'); }
function closeDialog() { document.getElementById('overlay').classList.remove('show'); }
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') return closeDialog();
  if (document.getElementById('overlay').classList.contains('show')) return;
  const go = (s) => { ev.preventDefault(); section = s; render(); };
  if (ev.key === 'F1') return go('help');
  if (ev.ctrlKey && ev.key === ',') return go('settings');
  if (ev.ctrlKey && ev.key.toLowerCase() === 'l') { ev.preventDefault(); return document.getElementById('lockbtn').click(); }
  if (ev.ctrlKey && ev.key.toLowerCase() === 'n') { ev.preventDefault(); section = 'entries'; render(); return editForm(null); }
  if (ev.ctrlKey && ev.key.toLowerCase() === 'f') { ev.preventDefault(); section = 'entries'; render(); return document.getElementById('q').focus(); }
});
let toastTimer; function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600); }

let locked = false;
function setLocked(v) { locked = v; const p = document.getElementById('lockpill'); p.textContent = v ? 'Locked' : 'Unlocked'; p.classList.toggle('unlocked', !v); updateAutolock(); }
function updateAutolock() { document.getElementById('autolock').textContent = locked ? 'The next use asks for the master password' : settings.idle === '0' ? 'Never locks by itself' : `Locks itself in ${settings.idle - 1} min`; }
document.getElementById('lockbtn').onclick = () => { setLocked(true); grants = []; renderNav(); render(); toast('Locked — remembered approvals forgotten'); };
document.getElementById('theme').onclick = () => { const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark'; };

function render() {
  renderNav();
  ({ entries: renderEntries, grants: renderGrants, history: renderHistory, data: renderData, settings: renderSettings, status: renderStatus, help: renderHelp })[section]();
}
document.getElementById('sidelogo').innerHTML = logoImg(22);
render();
</script>
