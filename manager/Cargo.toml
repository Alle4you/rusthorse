[package]
name = "rusthorse-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A GTK 4 client for the Rusthorse secrets agent."
license = "GPL-3.0-or-later"
repository = "https://github.com/Alle4you/rusthorse"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
rusthorse = { path = "..", default-features = false }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
nix = { version = "0.31.3", features = ["socket", "fs"] }

[dev-dependencies]
anyhow = "1.0.104"
# The widget tests serve a fake GNOME Keyring on their private session bus.
rusthorse = { path = "..", default-features = false, features = ["fake-keyring"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"
