name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The workspace's default members, rusthorse and rusthorse-broker: plain
  # cargo commands cover both. --all-features also turns on their features
  # for tests (fake-keyring, test-upstream), in debug builds only.
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Certificate authorities for the broker's tests
        # The broker's tests start the real broker, which reads the system's
        # file of certificate authorities before it serves anything (ADR
        # 0013): here the one that ca-certificates installs on the runner.
        # The file and every directory above it, links resolved, must belong
        # to root and not be writable by group or others, as the broker
        # requires; otherwise those tests fail.
        run: |
          path=$(realpath -e /etc/ssl/certs/ca-certificates.crt) || {
            echo "::error::no /etc/ssl/certs/ca-certificates.crt (package ca-certificates)"
            exit 1
          }
          while :; do
            stat -c '%U:%G %a %n' "$path"
            if [ "$(stat -c %u "$path")" != 0 ] || [ $(( 0$(stat -c %a "$path") & 022 )) != 0 ]; then
              echo "::error::$path must belong to root and not be writable by group or others"
              exit 1
            fi
            [ "$path" = / ] && break
            path=$(dirname "$path")
          done
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      # As released: the broker without its feature for tests, rusthorse
      # with its default features.
      - name: Clippy as released
        run: cargo clippy --all-targets
      # Each run of the tests has a TMPDIR of its own, which must be empty
      # afterwards: a test that returned before the agent ended its run had
      # the run's last audit record make the test's directory again there.
      - name: Tests
        run: |
          cargo test --all-features --no-run
          export TMPDIR=$(mktemp -d)
          cargo test --all-features
          if [ -n "$(ls -A "$TMPDIR")" ]; then
            echo "::error::the tests left files in TMPDIR"
            find "$TMPDIR" | head -50
            exit 1
          fi
      - name: Tests without default features
        run: |
          cargo test --no-default-features --no-run
          export TMPDIR=$(mktemp -d)
          cargo test --no-default-features
          if [ -n "$(ls -A "$TMPDIR")" ]; then
            echo "::error::the tests left files in TMPDIR"
            find "$TMPDIR" | head -50
            exit 1
          fi
      - name: Documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: A release build refuses the broker's feature for tests
        # The compile_error! in broker/src/main.rs, which nothing else
        # exercises; build-deb.sh also refuses a broker whose --check reports
        # the feature.
        env:
          CARGO_TERM_COLOR: never
        run: |
          if out=$(cargo check --release --locked -p rusthorse-broker --features test-upstream 2>&1); then
            echo "::error::a release build of rusthorse-broker accepted the test-upstream feature"
            exit 1
          fi
          echo "$out" | grep -F "the test-upstream feature is for tests only"

  dialog:
    name: GTK clients (dialog and manager)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GTK 4, libadwaita and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config xvfb xdotool xclip dbus-daemon
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p rusthorse-dialog -p rusthorse-manager --all-targets
      - name: Tests (widgets on Xvfb)
        run: cargo test -p rusthorse-dialog -p rusthorse-manager

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      # The code for tests only, too (the broker's test-upstream hooks).
      - run: cargo check --all-targets --all-features
