[package]
name = "rusthorse"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
# Also the Debian package's one-line description: under 80 characters.
description = "KeePass vault whose agent lets AI agents use secrets without seeing them"
license = "GPL-3.0-or-later"
repository = "https://github.com/Alle4you/rusthorse"
readme = "README.md"
keywords = ["secrets", "password-manager", "keepass", "ai-agents", "cli"]
categories = ["command-line-utilities", "authentication"]
exclude = ["/.github"]

[workspace]
# The dialog and manager need GTK 4 and libadwaita to build; plain
# `cargo build` and `cargo test` here build `rusthorse` only.
members = [".", "dialog", "manager"]
default-members = ["."]

[features]
default = ["secret-service", "session-lock"]
# `rusthorse import secret-service`: read items from GNOME Keyring / KWallet
# (any freedesktop Secret Service provider) over D-Bus.
secret-service = ["dep:secret-service"]
# The agent locks the vault when the screen locks or the computer suspends,
# told by logind and the screensavers over D-Bus (ADR 0009).
session-lock = ["dep:zbus"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
getrandom = "0.4"
keepass = { version = "0.17.0", features = ["save_kdbx4"] }
nix = { version = "0.31.3", features = ["socket", "uio", "process", "signal", "user", "resource", "poll", "fs"] }
rpassword = "7.5.4"
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"], optional = true }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["serde", "derive"] }

[dev-dependencies]
tempfile = "3.27.0"

# The Debian package, built by packaging/build-deb.sh with cargo-deb (not
# by `cargo deb` alone: the script generates the completions, the copyright
# file and the documentation first): the three programs, the agent's
# systemd user service (enabled for every user by packaging/deb/postinst),
# the manager's menu entry and icon, shell completions and the
# documentation. See docs/installation.md and ADR 0010.
[package.metadata.deb]
maintainer = "Alle4you <56454046+Alle4you@users.noreply.github.com>"
copyright = "2026 The Rusthorse contributors"
changelog = "packaging/deb/changelog"
section = "utils"
priority = "optional"
depends = "$auto"
suggests = "keepassxc"
extended-description = """\
Rusthorse keeps secrets in a KeePass (KDBX4) file and runs an agent, a \
systemd user service, through which programs — AI coding agents above all — \
use a secret without seeing it: the agent asks you in a dialog before each \
use, runs the approved command with the secret in its environment and hides \
the value in its output. It locks the vault when the screen locks or the \
computer suspends. The package contains the command-line program and the \
agent, the agent's dialogs and the visual manager."""
maintainer-scripts = "packaging/deb/"
assets = [
    ["target/release/rusthorse", "usr/bin/", "755"],
    ["target/release/rusthorse-dialog", "usr/bin/", "755"],
    ["target/release/rusthorse-manager", "usr/bin/", "755"],
    ["packaging/deb/rusthorse-agent.service", "usr/lib/systemd/user/", "644"],
    ["data/io.github.alle4you.Rusthorse.desktop", "usr/share/applications/", "644"],
    ["data/icons/hicolor/scalable/apps/io.github.alle4you.Rusthorse.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["target/release/packaging/completions/rusthorse", "usr/share/bash-completion/completions/", "644"],
    ["target/release/packaging/completions/_rusthorse", "usr/share/zsh/vendor-completions/", "644"],
    ["target/release/packaging/completions/rusthorse.fish", "usr/share/fish/vendor_completions.d/", "644"],
    # Generated by packaging/copyright.py and packaging/docs.py.
    ["target/release/packaging/copyright", "usr/share/doc/rusthorse/copyright", "644"],
    ["target/release/packaging/doc/**/*", "usr/share/doc/rusthorse/", "644"],
]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
print_stdout = "allow"
unwrap_used = "warn"

# Argon2 and AES are painfully slow without optimizations; keep tests fast.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
