[package]
name = "rusthorse"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A local KeePass (KDBX4) secrets vault with an approval-gated agent that lets AI coding agents use credentials without seeing them."
license = "GPL-3.0-or-later"
repository = "https://github.com/Alle4you/rusthorse"
readme = "README.md"
keywords = ["secrets", "password-manager", "keepass", "ai-agents", "cli"]
categories = ["command-line-utilities", "authentication"]
exclude = ["/.github"]

[workspace]
# The dialog and manager need GTK 4 and libadwaita to build; plain
# `cargo build` and `cargo test` here build `rusthorse` only.
members = [".", "dialog", "manager"]
default-members = ["."]

[features]
default = ["secret-service", "session-lock"]
# `rusthorse import secret-service`: read items from GNOME Keyring / KWallet
# (any freedesktop Secret Service provider) over D-Bus.
secret-service = ["dep:secret-service"]
# The agent locks the vault when the screen locks or the computer suspends,
# told by logind and the screensavers over D-Bus (ADR 0009).
session-lock = ["dep:zbus"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
getrandom = "0.4"
keepass = { version = "0.17.0", features = ["save_kdbx4"] }
nix = { version = "0.31.3", features = ["socket", "uio", "process", "signal", "user", "resource", "poll", "fs"] }
rpassword = "7.5.4"
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"], optional = true }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["serde", "derive"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
print_stdout = "allow"
unwrap_used = "warn"

# Argon2 and AES are painfully slow without optimizations; keep tests fast.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
